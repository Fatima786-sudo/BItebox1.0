<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bite Box</title>
    <link rel="stylesheet" href="style.css">
    <script
        src="https://kit.fontawesome.com/cc2092efaa.js" crossorigin="anonymous">
    </script>
</head>
<body>
    <!-- Logo -->
     <header> <!-- This is a container-->
        <img src="images/logo .png" alt="BiteBox Logo" class="logoclass">

    <nav> <!--This is a container-->
        <a href="home.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="biteDeals.html">BiteDeals</a>
        <a href="cart.html"><i class="fa fa-shopping-cart" aria-hidden="true"></i></a>
        <a href="login.html"><i class="fa-solid fa-arrow-right-to-bracket"></i>Login</a>
    </nav>
    </header>
    <section class="cart">
        <h2 style="text-align: center;">Your Cart</h2>
        <table>
            <thead>
                <th>Item</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Total</th>
                <th>Remove</th>
            </thead>
        <tbody>
            <tr>
                <td class="item">
                <img src="images/burger-card1.png" alt="">
                <div>
                <h4>Cheese Burger</h4>
                <p>Juicy grilled burger</p>
                </div>
                </td>
                <td>₹199</td>
                <td>
                    <div class="qty-box">
                        <button>-</button>
                        <span>1</span>
                        <button>+</button>
                    </div>
                </td>
                <td>₹199</td>
                <td><button class="remove">X</button></td>
            </tr>
            <tr>
                <td class="item">
                <img src="images/pizza-card2.png" alt="">
                <div>
                <h4>Capsicum Pizza</h4>
                <p>Loaded with cheese</p>
                </div>
                </td>
                <td>₹249</td>
                <td>
                    <div class="qty-box">
                        <button>-</button>
                        <span>1</span>
                        <button>+</button>
                    </div>
                </td>
                <td>₹249</td>
                <td><button class="remove">X</button></td>
            </tr>
            <tr>
                <td class="item">
                <img src="images/alfredo-card4.png" alt="">
                <div>
                <h4>Alfredo Pasta</h4>
                <p>Creamy white sauce</p>
                </div>
                </td>
                <td>₹229</td>
                <td>
                    <div class="qty-box">
                        <button>-</button>
                        <span>1</span>
                        <button>+</button>
                    </div>
                </td>
                <td>₹229</td>
                <td><button class="remove">X</button></td>
            </tr>
            <tr class="grand-total">
                <td colspan="3">Grand Total</td>
                <td>₹797</td>
                <td><button>Proceed</button></td>
            </tr>
        </tbody>
    </table>

    </section>

</body>
</html>
