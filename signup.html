<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bite Box</title>
    <link rel="stylesheet" href="style.css">
    <script
        src="https://kit.fontawesome.com/cc2092efaa.js" crossorigin="anonymous">
    </script>
</head>
<body>
    <!-- Logo -->
     <header> <!-- This is a container-->
        <img src="images/logo .png" alt="BiteBox Logo" class="logoclass">

    <nav> <!--This is a container-->
        <a href="home.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="biteDeals.html">BiteDeals</a>
        <a href="cart.html"><i class="fa fa-shopping-cart" aria-hidden="true"></i></a>
        <a href="login.html"><i class="fa-solid fa-arrow-right-to-bracket"></i>Login</a>
    </nav>
    </header>
    <section class="auth-container">
        <div class="auth-box">
            <h2>Create Account</h2>
            <form action="">
                <input type="text" placeholder="Full Name" required>
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>
                <input type="password" placeholder="Confirm Password" required>
                <button type="submit">Login</button>
            </form>
            <p>Already have an account? <a href="login.html">Login</a></p>


        </div>

    </section>
    
</body>
</html>
